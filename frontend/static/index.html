<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisualAssist</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d6efd;
    --accent-dark: #0a58ca;
    --accent-light: #e7f1ff;
    --bg: #f3f6fb;
    --surface: #ffffff;
    --border: #dbe2ea;
    --text: #1a202c;
    --text-muted: #5a6a80;
    --user-msg-bg: #0d6efd;
    --agent-msg-bg: #ffffff;
    --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-md: 0 4px 8px -2px rgba(16, 24, 40, 0.08), 0 2px 4px -2px rgba(16, 24, 40, 0.04);
  }
  * { box-sizing:border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--surface);
    color: var(--text);
    padding: 0.85rem 1.5rem;
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--text);
  }
  .header-badge {
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    margin: auto 0;
    padding: 2rem 1rem;
  }
  .empty-state h3 {
    margin: 0 0 0.5rem;
    color: var(--text);
    font-size: 1.25rem;
  }
  .empty-state p {
    font-size: 0.95rem;
    margin: 0;
    max-width: 480px;
    margin-inline: auto;
  }
  .msg-wrapper {
    display: flex;
    gap: 0.65rem;
    max-width: 88%;
  }
  .msg-wrapper.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-wrapper.agent {
    align-self: flex-start;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  .msg-wrapper.user .avatar {
    background: var(--accent);
    color: #fff;
  }
  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    max-width: 100%;
  }
  .msg-meta {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 500;
    padding: 0 0.35rem;
  }
  .msg-wrapper.user .msg-meta {
    text-align: right;
  }
  .bubble {
    display: inline-block;
    padding: 0.75rem 1rem;
    border-radius: 14px;
    background: var(--agent-msg-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    color: var(--text);
    line-height: 1.5;
    white-space: pre-wrap;
    font-size: 0.95rem;
  }
  .msg-wrapper.user .bubble {
    background: var(--user-msg-bg);
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
  }
  .msg-wrapper.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone */
  .bubble.rich {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
  }
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.4rem 0.6rem;
  }
  .typing-dot {
    width: 7px;
    height: 7px;
    background-color: var(--accent);
    border-radius: 50%;
    animation: typingPulse 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingPulse {
    0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  .preview-image {
    max-width: 100%;
    border-radius: 12px;
    margin-top: 0.8rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    border: 1px solid var(--border);
    display: block;
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.6rem 0;
    font-size: 0.88rem;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .data-table th, .data-table td {
    padding: 0.55rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .data-table th {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 600;
  }
  .footer-container {
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 8px rgba(16, 24, 40, 0.03);
  }
  .examples {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1rem 0;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .example-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--accent);
    border-radius: 20px;
    padding: 0.4rem 0.85rem;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease-in-out;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }
  .example-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 1rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.98rem;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background-color 0.15s;
  }
  input:focus {
    border-color: var(--accent);
    background: #fff;
  }
  button[type="submit"] {
    padding: 0.75rem 1.4rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease-in-out, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  button[type="submit"]:hover {
    background: var(--accent-dark);
  }
  button[type="submit"]:active {
    transform: scale(0.98);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem;
    background: #fff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.65rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <span style="font-size: 1.3rem;">👁️</span>
    <span>VisualAssist</span>
  </div>
  <span class="header-badge">Daily Living &amp; Home Organization</span>
</header>
<div id="log">
  <div id="empty-state" class="empty-state">
    <h3>Welcome to VisualAssist</h3>
    <p>Your accessibility companion for household organization, pantry inventories, and medication schedules with high-contrast visual cues.</p>
  </div>
</div>
<div class="footer-container">
  <div class="examples">
    <button type="button" class="example-btn" onclick="sendPrompt('Show my pantry inventory and where items are stored')">📦 Show pantry inventory</button>
    <button type="button" class="example-btn" onclick="sendPrompt('What is my medication schedule and tactile cues for Lisinopril?')">💊 Check medication & tactile cues</button>
    <button type="button" class="example-btn" onclick="sendPrompt('Generate a visual aid card image for my Lisinopril medication')">🏷️ Generate visual cue card</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask about pantry items, medication schedules, or visual aids…" autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const empty = document.getElementById("empty-state");
  if (empty) empty.remove();

  const wrap = el("div", "msg-wrapper " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "👁️");
  const content = el("div", "msg-content");
  
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const meta = el("div", "msg-meta", (who === "user" ? "You" : "VisualAssist") + " • " + time);
  
  const b = el("div", "bubble");
  content.appendChild(meta);
  content.appendChild(b);
  
  wrap.appendChild(avatar);
  wrap.appendChild(content);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); 
      img.src = src; 
      img.alt = boundStr(props.altText || props.alt) || "";
      img.onload = () => { log.scrollTop = log.scrollHeight; };
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function formatMarkdown(text) {
  if (!text) return "";
  // Check for markdown table
  if (text.includes("|") && text.includes("\n")) {
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    const tableLines = lines.filter(l => l.startsWith("|") && l.endsWith("|"));
    if (tableLines.length >= 3) {
      let html = '<table class="data-table"><thead><tr>';
      const headers = tableLines[0].split("|").slice(1, -1).map(h => h.trim());
      headers.forEach(h => { html += `<th>${h}</th>`; });
      html += '</tr></thead><tbody>';
      for (let i = 2; i < tableLines.length; i++) {
        const cells = tableLines[i].split("|").slice(1, -1).map(c => c.trim());
        html += '<tr>';
        cells.forEach(c => { html += `<td>${c}</td>`; });
        html += '</tr>';
      }
      html += '</tbody></table>';
      return html;
    }
  }
  // Convert standard markdown bold and line breaks
  let formatted = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br/>');

  // Convert raw image URLs to direct high-contrast image preview cards
  formatted = formatted.replace(/(https:\/\/storage\.googleapis\.com\/[^\s<"]+?\.(?:png|jpg|jpeg|webp))/gi, '<a href="$1" target="_blank" rel="noopener"><img src="$1" class="preview-image" alt="Generated Visual Aid Card"/></a>');
  return formatted;
}

function renderReply(b, parts) {
  b.innerHTML = "";   // clear the typing indicator
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const d = el("div");
    d.innerHTML = formatMarkdown(textStr);
    b.appendChild(d);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function sendPrompt(text) {
  text = (text || "").trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  b.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  await sendPrompt(input.value);
});
</script>
</body>
</html>
